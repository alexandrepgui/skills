<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" id="hl-light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" id="hl-dark">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f2eb;
    --paper: #fffdf7;
    --paper-2: #f0ece1;
    --ink: #1e2422;
    --muted: #6c746f;
    --line: #d8d0c0;
    --line-strong: #a89c88;
    --accent: #0e766e;
    --accent-2: #b4472f;
    --accent-3: #2d5d91;
    --warn: #a96b00;
    --bad: #b2382f;
    --good: #2d7a49;
    --code-bg: #fffdf7;
    --code-fg: #1e2422;
    --shadow: 0 18px 46px rgba(40, 34, 24, .12);
    --radius: 8px;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --serif: Georgia, "Times New Roman", serif;
    --sans: Avenir Next, Segoe UI, Helvetica Neue, sans-serif;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #111613;
    --paper: #181f1b;
    --paper-2: #202923;
    --ink: #f0eee6;
    --muted: #a8b2aa;
    --line: #334038;
    --line-strong: #5e7065;
    --accent: #61c5b7;
    --accent-2: #ff8b6e;
    --accent-3: #8bb8f1;
    --warn: #e2ac4d;
    --bad: #ff786e;
    --good: #72cf91;
    --code-bg: #0d1110;
    --code-fg: #f5f1e8;
    --shadow: 0 18px 46px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      linear-gradient(90deg, rgba(14,118,110,.055) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(180deg, rgba(180,71,47,.045) 1px, transparent 1px) 0 0 / 44px 44px,
      var(--bg);
    color: var(--ink);
    font: 15px/1.62 var(--sans);
  }
  a { color: inherit; }
  code, pre { font-family: var(--mono); }
  code:not(pre code) {
    border: 1px solid var(--line);
    border-radius: 5px;
    background: color-mix(in srgb, var(--paper-2) 74%, transparent);
    padding: .06rem .35rem;
    font-size: .88em;
    overflow-wrap: break-word;
    word-break: normal;
    white-space: normal;
  }
  pre {
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--code-bg);
    color: var(--code-fg);
    box-shadow: var(--shadow);
  }
  pre code.hljs { padding: 1rem 1.1rem; font-size: .84rem; background: transparent; }
  .shell {
    display: grid;
    grid-template-columns: 270px minmax(0, 1fr);
    gap: 28px;
    max-width: min(1720px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 26px 28px 72px;
  }
  .sidebar {
    position: sticky;
    top: 18px;
    align-self: start;
    height: calc(100vh - 36px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    box-shadow: var(--shadow);
    overflow: auto;
  }
  .side-head { padding: 20px 18px 16px; border-bottom: 1px solid var(--line); }
  .eyebrow { margin: 0 0 8px; color: var(--accent-2); font: 700 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .side-title { margin: 0; font: 700 23px/1.05 var(--serif); }
  .theme-toggle {
    width: 100%;
    margin-top: 16px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: var(--paper-2);
    color: var(--ink);
    font: 700 12px/1 var(--mono);
    letter-spacing: .04em;
    padding: 10px 12px;
    cursor: pointer;
  }
  nav { display: grid; padding: 12px 10px 18px; }
  nav a {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 8px;
    align-items: baseline;
    border-radius: 6px;
    padding: 9px 8px;
    color: var(--muted);
    text-decoration: none;
  }
  nav a:hover, nav a.active { background: var(--paper-2); color: var(--ink); }
  nav .num { color: var(--accent); font: 700 11px/1 var(--mono); }
  nav .label { font-size: 13px; line-height: 1.25; }
  main { min-width: 0; }
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr);
    gap: 30px;
    align-items: stretch;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background:
      radial-gradient(circle at 12% 16%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 34%),
      radial-gradient(circle at 82% 28%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 32%),
      var(--paper);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .hero-copy { padding: 44px 46px 38px; }
  h1 { margin: 0; max-width: 860px; font: 760 clamp(2.4rem, 5.2vw, 5.2rem)/.95 var(--serif); letter-spacing: -.035em; }
  .dek { max-width: 720px; margin: 20px 0 0; color: var(--muted); font-size: 18px; }
  .hero-card { display: grid; align-content: end; min-height: 330px; padding: 28px; background: color-mix(in srgb, var(--paper-2) 62%, transparent); border-left: 1px solid var(--line); }
  .hero-card .big { color: var(--accent); font: 800 64px/.9 var(--serif); }
  section { margin: 34px 0; scroll-margin-top: 24px; }
  .section-head { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; align-items: start; margin: 0 0 16px; }
  .chapter { color: var(--accent-2); font: 800 32px/.9 var(--serif); }
  h2 { margin: 0; font-size: clamp(1.65rem, 3vw, 2.75rem); line-height: 1.05; letter-spacing: -.025em; }
  .section-intro { max-width: 760px; margin: 8px 0 0; color: var(--muted); font-size: 16px; }
  .section-body { border: 1px solid var(--line); border-radius: var(--radius); background: color-mix(in srgb, var(--paper) 94%, transparent); box-shadow: var(--shadow); padding: 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card, .callout, .risk-card, .compare-card, .step {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    padding: 16px 18px;
    min-width: 0;
  }
  .callout { border-left: 5px solid var(--accent); }
  .callout.warn { border-left-color: var(--warn); }
  .callout.bad { border-left-color: var(--bad); }
  .callout.good { border-left-color: var(--good); }
  .compare-grid, .risk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .compare-grid pre code.hljs { font-size: .76rem; line-height: 1.45; }
  .risk-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .risk-card.high { border-top: 5px solid var(--bad); }
  .risk-card.medium { border-top: 5px solid var(--warn); }
  .risk-card.low { border-top: 5px solid var(--good); }
  .flow-row { position: relative; display: grid; grid-template-columns: repeat(5, minmax(140px, 1fr)); gap: 12px; }
  .flow-row::before { content: ""; position: absolute; left: 8%; right: 8%; top: 28px; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .flow-step { position: relative; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); padding: 58px 14px 16px; min-height: 178px; overflow-wrap: anywhere; }
  .flow-step::before { content: attr(data-step); position: absolute; top: 16px; left: 14px; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 999px; background: var(--accent); color: white; font: 800 12px/1 var(--mono); }
  .flow-step h3 { margin: 0 0 8px; font-size: 15px; }
  .flow-step p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .steps { counter-reset: step; display: grid; gap: 12px; }
  .step { counter-increment: step; display: flex; gap: 12px; align-items: flex-start; overflow-wrap: break-word; }
  .step::before { content: counter(step); display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-2); color: var(--muted); font: 800 12px/1 var(--mono); }
  .step > * { min-width: 0; flex: 1; }
  @media (max-width: 980px) {
    .shell { display: block; padding: 18px; }
    .sidebar { position: relative; height: auto; margin-bottom: 18px; }
    .hero, .grid, .compare-grid, .risk-grid, .risk-grid.three, .flow-row { grid-template-columns: 1fr; }
    .flow-row::before { display: none; }
    .section-head { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="side-head">
      <p class="eyebrow">{{KICKER}}</p>
      <p class="side-title">{{SHORT_TITLE}}</p>
      <button class="theme-toggle" type="button" id="theme-toggle">Toggle theme</button>
    </div>
    <nav id="toc"></nav>
  </aside>
  <main>
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">{{KICKER}}</p>
        <h1>{{TITLE}}</h1>
        <p class="dek">{{DEK}}</p>
      </div>
      <div class="hero-card">
        <div class="big">{{BIG_NUMBER}}</div>
        <p>{{HERO_NOTE}}</p>
      </div>
    </header>
    <section id="summary">
      <div class="section-head"><div class="chapter">01</div><div><h2>TL;DR</h2><p class="section-intro">{{SUMMARY_INTRO}}</p></div></div>
      <div class="section-body"><div class="callout">{{SUMMARY}}</div></div>
    </section>
    <section id="flow">
      <div class="section-head"><div class="chapter">02</div><div><h2>Flow</h2><p class="section-intro">{{FLOW_INTRO}}</p></div></div>
      <div class="section-body">
        <div class="flow-row">
          <article class="flow-step" data-step="1"><h3>Start</h3><p>{{FLOW_STEP_1}}</p></article>
          <article class="flow-step" data-step="2"><h3>Next</h3><p>{{FLOW_STEP_2}}</p></article>
          <article class="flow-step" data-step="3"><h3>Finish</h3><p>{{FLOW_STEP_3}}</p></article>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script>
  hljs.highlightAll();
  const root = document.documentElement;
  const saved = localStorage.getItem("artifact-theme");
  if (saved) root.dataset.theme = saved;
  function syncTheme() {
    document.getElementById("hl-light").disabled = root.dataset.theme === "dark";
    document.getElementById("hl-dark").disabled = root.dataset.theme !== "dark";
  }
  syncTheme();
  document.getElementById("theme-toggle").addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("artifact-theme", root.dataset.theme);
    syncTheme();
  });
  const toc = document.getElementById("toc");
  document.querySelectorAll("main section[id]").forEach((section, index) => {
    const h = section.querySelector("h2");
    if (!h) return;
    const a = document.createElement("a");
    a.href = "#" + section.id;
    a.innerHTML = `<span class="num">${String(index + 1).padStart(2, "0")}</span><span class="label">${h.textContent}</span>`;
    toc.appendChild(a);
  });
</script>
</body>
</html>
